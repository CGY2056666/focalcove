# Add this block inside your existing HTTPS server block (for example
# your-domain.example). It leaves every current browser route on the old upstream,
# sends the Android JSON API to the new loopback service, and exposes only its
# minimal health response instead of the legacy web runtime diagnostics.
location = /health {
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";

    proxy_pass http://127.0.0.1:8001;
}

location ^~ /api/v1/ {
    client_max_body_size 5m;
    client_body_buffer_size 5m;

    # Stream screenshots to Flask instead of writing request bodies to Nginx
    # temporary files. The Android client never retries or replays old frames.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    proxy_connect_timeout 5s;
    proxy_send_timeout 20s;
    proxy_read_timeout 20s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";

    proxy_pass http://127.0.0.1:8001;
}
